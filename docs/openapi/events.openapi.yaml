openapi: 3.1.0
info:
  title: Sudo AI Event System API
  version: 1.0.0
  description: >
    Outbound webhook endpoint management, event log, delivery logs and replay.
    See docs/EVENTS.md for the delivery contract (signatures, retries, DLQ)
    and the WebSocket realtime protocol.
servers:
  - url: http://127.0.0.1:18900
security:
  - gatewayToken: []
components:
  securitySchemes:
    gatewayToken:
      type: http
      scheme: bearer
      description: GATEWAY_TOKEN (loopback accepted in dev when unset)
  schemas:
    Event:
      type: object
      properties:
        id: { type: string, example: evt_mdkq1x2ab34cd56ef }
        type: { type: string, example: message.completed }
        version: { type: integer, example: 1 }
        createdAt: { type: string, format: date-time }
        idempotencyKey: { type: string }
        channels: { type: array, items: { type: string }, example: ["session:main"] }
        data: { type: object, additionalProperties: true }
    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, example: whep_mdkq1xa1b2c3d4 }
        name: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        enabled: { type: boolean }
        event_types: { type: array, items: { type: string }, example: ["message.completed", "tool.*"] }
        retry_max: { type: integer, minimum: 0, maximum: 10 }
        secret:
          type: string
          description: Full value ONLY on create/rotate responses; masked (whsec_…xxxx) elsewhere.
        secret_rotation_grace_until: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EndpointInput:
      type: object
      required: [name, url, event_types]
      properties:
        name: { type: string, maxLength: 120 }
        url: { type: string, format: uri, description: http(s) only; no credentials; SSRF-guarded at delivery }
        description: { type: string, maxLength: 1000 }
        event_types:
          type: array
          minItems: 1
          items: { type: string }
          description: Exact catalog names, `prefix.*`, or `*`.
        retry_max: { type: integer, minimum: 0, maximum: 10, default: 5 }
        enabled: { type: boolean, default: true }
    Delivery:
      type: object
      properties:
        id: { type: string, example: whdel_mdkq1xa1b2c3d4e5 }
        endpointId: { type: string }
        eventId: { type: string }
        status: { type: string, enum: [pending, delivering, succeeded, dead] }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        nextAttemptAt: { type: integer, description: epoch ms }
        lastStatusCode: { type: [integer, "null"] }
        lastError: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    Attempt:
      type: object
      properties:
        deliveryId: { type: string }
        attempt: { type: integer }
        at: { type: string, format: date-time }
        ok: { type: integer, enum: [0, 1] }
        statusCode: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        durationMs: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            code: { type: integer }
paths:
  /v1/webhook-endpoints:
    get:
      summary: List webhook endpoints (secrets masked)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints: { type: array, items: { $ref: "#/components/schemas/WebhookEndpoint" } }
    post:
      summary: Create a webhook endpoint
      description: The response is the ONLY place the full signing secret appears. Store it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndpointInput" }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint: { $ref: "#/components/schemas/WebhookEndpoint" }
        "400": { content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/webhook-endpoints/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Get one endpoint (secret masked)
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    patch:
      summary: Update name/url/description/event_types/retry_max/enabled
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EndpointInput" }
      responses:
        "200": { description: Updated }
    delete:
      summary: Delete the endpoint and its delivery history
      responses:
        "200": { description: Deleted }
  /v1/webhook-endpoints/{id}/rotate-secret:
    post:
      summary: Rotate the signing secret
      description: New secret returned once; the previous secret co-signs deliveries for 24 h.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Rotated — response contains the new full secret }
  /v1/webhook-endpoints/{id}/test:
    post:
      summary: Enqueue and immediately deliver a synthetic `notification` test event
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  event_id: { type: string }
                  delivery: { $ref: "#/components/schemas/Delivery" }
  /v1/webhook-endpoints/{id}/deliveries:
    get:
      summary: Delivery log for an endpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivering, succeeded, dead] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries: { type: array, items: { $ref: "#/components/schemas/Delivery" } }
  /v1/events:
    get:
      summary: Query the persistent event log
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: since_ms, in: query, schema: { type: integer, description: epoch ms lower bound } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Event" } }
  /v1/events/types:
    get:
      summary: Event catalog (all types + webhook-eligible list)
      responses:
        "200": { description: OK }
  /v1/events/stats:
    get:
      summary: Counters (events, endpoints, deliveries by status)
      responses:
        "200": { description: OK }
  /v1/events/dashboard:
    get:
      summary: Self-contained HTML dashboard (no token; data calls are token-gated)
      security: []
      responses:
        "200": { description: HTML }
  /v1/events/{id}:
    get:
      summary: Get one event by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404": { description: Not found }
  /v1/events/deliveries/{id}:
    get:
      summary: Delivery detail (delivery + attempts + event)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery: { $ref: "#/components/schemas/Delivery" }
                  attempts: { type: array, items: { $ref: "#/components/schemas/Attempt" } }
                  event: { $ref: "#/components/schemas/Event" }
  /v1/events/deliveries/{id}/replay:
    post:
      summary: Re-arm a delivery (DLQ replay) with a fresh attempt budget
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Re-armed and delivery triggered }
        "404": { description: Not found }
